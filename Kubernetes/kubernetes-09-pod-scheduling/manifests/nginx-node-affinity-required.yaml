apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-affinity-required
  labels:
    app: nginx-affinity-required
spec:
  replicas: 5
  selector:
    matchLabels:
      app: nginx-affinity-required
  template:
    metadata:
      labels:
        app: nginx-affinity-required
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: size
                    operator: In
                    values:
                      - large
                      - medium
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
