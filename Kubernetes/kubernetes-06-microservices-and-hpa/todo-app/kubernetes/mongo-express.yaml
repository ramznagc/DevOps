apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express-deployment
  labels:
    app.kubernetes.io/name: todoapp
    app.kubernetes.io/component: database-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: todoapp
      app.kubernetes.io/component: database-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: todoapp
        app.kubernetes.io/component: database-admin
    spec:
      containers:
        - name: mongo-express
          image: mongo-express:1.0.2-20
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: ME_CONFIG_MONGODB_URL
              value: mongodb://db-service:27017/
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-express-service
  labels:
    app.kubernetes.io/name: todoapp
    app.kubernetes.io/component: database-admin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: todoapp
    app.kubernetes.io/component: database-admin
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
