apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: name-based-virtual-hosting
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: nginx.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mynginx
                port:
                  number: 80
    - host: apache.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: myapache
                port:
                  number: 80
