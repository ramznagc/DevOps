apiVersion: apps/v1
kind: Deployment
metadata:
  name: readiness-demo
  labels:
    app: readiness-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: readiness-demo
  template:
    metadata:
      labels:
        app: readiness-demo
    spec:
      containers:
        - name: readiness
          image: clarusway/readinessprobe
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
            successThreshold: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: readiness-service
spec:
  type: ClusterIP
  selector:
    app: readiness-demo
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
