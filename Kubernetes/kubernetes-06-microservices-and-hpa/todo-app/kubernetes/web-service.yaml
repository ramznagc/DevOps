apiVersion: v1
kind: Service
metadata:
  name: web-service
  labels:
    app.kubernetes.io/name: todoapp
    app.kubernetes.io/component: web
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: todoapp
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30001
      protocol: TCP
