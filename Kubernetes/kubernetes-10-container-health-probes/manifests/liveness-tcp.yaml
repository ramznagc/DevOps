apiVersion: v1
kind: Pod
metadata:
  name: liveness-tcp
  labels:
    app: liveness-tcp
spec:
  containers:
    - name: mysql
      image: mysql:8.4
      ports:
        - name: mysql
          containerPort: 3306
      env:
        - name: MYSQL_ROOT_PASSWORD
          value: "demo-only-change-me"
      livenessProbe:
        tcpSocket:
          port: mysql
        initialDelaySeconds: 15
        periodSeconds: 20
