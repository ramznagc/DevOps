apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-node-selector
  labels:
    app: nginx-node-selector
spec:
  replicas: 5
  selector:
    matchLabels:
      app: nginx-node-selector
  template:
    metadata:
      labels:
        app: nginx-node-selector
    spec:
      nodeSelector:
        size: large
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
