apiVersion: v1
kind: Pod
metadata:
  name: liveness-http
  labels:
    app: liveness-http
spec:
  containers:
    - name: liveness
      image: clarusway/probes
      ports:
        - name: http
          containerPort: 80
      livenessProbe:
        httpGet:
          path: /healthz
          port: http
        initialDelaySeconds: 3
        periodSeconds: 3
