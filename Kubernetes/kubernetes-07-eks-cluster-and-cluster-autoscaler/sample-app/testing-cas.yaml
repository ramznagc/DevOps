apiVersion: v1
kind: Namespace
metadata:
  name: my-namespace
  labels:
    app.kubernetes.io/name: container-info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: container-info-deploy
  namespace: my-namespace
  labels:
    app.kubernetes.io/name: container-info
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: container-info
  template:
    metadata:
      labels:
        app.kubernetes.io/name: container-info
    spec:
      containers:
        - name: container-info
          image: ondiacademy/container-info:1.0
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: container-info-svc
  namespace: my-namespace
  labels:
    app.kubernetes.io/name: container-info
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: container-info
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
