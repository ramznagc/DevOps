services:
  db:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - todonet

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3000"
      DBHOST: mongodb://db:27017/express-todo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - todonet

volumes:
  mongo-data:

networks:
  todonet:
    driver: bridge
