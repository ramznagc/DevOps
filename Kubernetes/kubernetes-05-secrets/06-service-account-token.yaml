# LEGACY example: a ServiceAccount token Secret.
# Kubernetes may populate token-related data asynchronously.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookstore-api
  namespace: secret-demo
---
apiVersion: v1
kind: Secret
metadata:
  name: bookstore-api-token
  namespace: secret-demo
  annotations:
    kubernetes.io/service-account.name: bookstore-api
type: kubernetes.io/service-account-token
