apiVersion: v1
kind: Service
metadata:
  name: db-service
  labels:
    app.kubernetes.io/name: todoapp
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: todoapp
    app.kubernetes.io/component: database
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
      protocol: TCP
